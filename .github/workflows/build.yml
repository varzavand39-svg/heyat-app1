name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # ساخت زیرساخت تمیز اندروید بدون مشکل نام‌گذاری مخزن
          flutter create heyat_app --org com.shohadaamameh.heyat
          cd heyat_app

          # انتقال فایل‌های اصلی شما به پروژه
          cp $GITHUB_WORKSPACE/pubspec.yaml ./pubspec.yaml
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart

          # دانلود وابستگی‌ها و کامپایل فایل نصبی
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: heyat_app/build/app/outputs/flutter-apk/app-release.apk
