name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK Cleanly
        run: |
          # ساخت یک پروژه استاندارد جدید در پوشه موقت
          flutter create myapp --org com.shohadaamameh.heyat
          cd myapp

          # جایگذاری فایل‌های اصلی و تاییدشده شما
          cp $GITHUB_WORKSPACE/pubspec.yaml ./pubspec.yaml
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart

          # دریافت پکیج‌ها و ساخت فایل نصبی
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
