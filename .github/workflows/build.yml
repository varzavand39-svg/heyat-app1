name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK Cleanly
        run: |
          # ساخت پروژه استاندارد جدید
          flutter create heyat_app --org com.shohadaamameh.heyat
          cd heyat_app

          # افزودن خودکار پکیج‌های مورد نیاز
          flutter pub add http shared_preferences url_launcher flutter_localizations

          # جایگذاری کد اصلی شما
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart

          # ساخت فایل نصبی
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: heyat_app/build/app/outputs/flutter-apk/app-release.apk
