name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build in Clean Folder
        run: |
          # ۱. ساخت پروژه فلاتر تمیز
          flutter create heyat_app --org com.shohadaamameh.heyat

          # ۲. ساخت خودکار فایل تنظیمات با تمام پکیج‌های مورد نیاز کد شما
          cat << 'EOF' > heyat_app/pubspec.yaml
          name: heyat_app
          description: هیئت مجاهدین حسینی شهدای امامه
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            http: ^1.2.1
            shared_preferences: ^2.2.3
            url_launcher: ^6.3.0

          flutter:
            uses-material-design: true
          EOF

          # ۳. انتقال فایل main.dart شما به پوشه پروژه
          cp lib/main.dart heyat_app/lib/main.dart

          # ۴. دریافت پکیج‌ها و کامپایل نهایی
          cd heyat_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: heyat_app/build/app/outputs/flutter-apk/app-release.apk
