name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Config
        run: |
          # پشتیبان‌گیری از فایل‌های اختصاصی شما
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart lib/main.dart.bak

          # ایجاد زیرساخت اندروید با نام استاندارد بدون خط تیره
          flutter create . --project-name heyat_app --platforms=android --org com.shohadaamameh.heyat

          # بازگردانی فایل‌های اصلی هیئت
          cp pubspec.yaml.bak pubspec.yaml
          cp lib/main.dart.bak lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
