name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build in Clean Folder
        run: |
          # ساخت پروژه در یک پوشه استاندارد بدون خط تیره
          flutter create heyat_app --org com.shohadaamameh.heyat
          
          # انتقال کدهای شما به پوشه جدید
          cp -r lib/* heyat_app/lib/
          cp pubspec.yaml heyat_app/pubspec.yaml
          
          # ورود به پوشه و ساخت نهایی
          cd heyat_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: heyat_app/build/app/outputs/flutter-apk/app-release.apk
