name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Project
        run: |
          set -e
          echo "=== 1. Creating Flutter Project ==="
          flutter create project_dir --org com.shohadaamameh.heyat --project-name heyat_app
          
          echo "=== 2. Copying User Files ==="
          cp pubspec.yaml project_dir/pubspec.yaml
          cp lib/main.dart project_dir/lib/main.dart
          
          cd project_dir
          
          echo "=== 3. Getting Dependencies ==="
          flutter pub get
          
          echo "=== 4. Building APK ==="
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: project_dir/build/app/outputs/flutter-apk/app-release.apk
