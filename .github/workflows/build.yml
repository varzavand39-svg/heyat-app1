name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 1. Create Flutter Project Structure
        run: |
          flutter create project_dir --org com.shohadaamameh.heyat --project-name heyat_app
          cp pubspec.yaml project_dir/pubspec.yaml
          cp lib/main.dart project_dir/lib/main.dart

      - name: 2. Install Dependencies
        run: |
          cd project_dir
          flutter pub get

      - name: 3. Build Release APK
        run: |
          cd project_dir
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heyat-App-Release
          path: project_dir/build/app/outputs/flutter-apk/app-release.apk
